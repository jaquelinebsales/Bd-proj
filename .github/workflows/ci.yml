name: Testes

on:
  push:
  pull_request:

jobs:
  app:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  funcoes:
    name: Edge Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check enviar-precos/index.ts sincronizar-cadastro-anp/index.ts excluir-conta/index.ts
      - run: deno test

  scripts:
    name: Scripts de publicação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/supabase -p "test_*.py"

  banco:
    name: Regras no banco (Postgres 17 + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gasprice
    steps:
      - uses: actions/checkout@v4
      - name: Cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Banco limpo (sem o PostGIS que a imagem instala no banco padrão)
        run: createdb -T template0 gasprice
      - name: Aplicar shims e migrações
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/shims_supabase.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            sed -E 's/^create extension if not exists pg_(cron|net)\s*;/-- teste: pg_\1 simulada/I' "$f" > /tmp/migracao.sql
            psql -v ON_ERROR_STOP=1 -q -f /tmp/migracao.sql
            echo "aplicado: $f"
          done
      - name: Testes das regras
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/regras_test.sql
