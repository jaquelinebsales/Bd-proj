name: Gerar APK

# Gera o APK de teste sob demanda (aba Actions → Gerar APK → Run workflow).
# Segredos necessários: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY. O mapa (OpenFreeMap) não usa chave.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configuração do app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Variável do repositório (Settings → Secrets and variables → Actions → Variables): combustivel no servidor próprio
          SUPABASE_SCHEMA: ${{ vars.SUPABASE_SCHEMA || 'public' }}
        run: |
          printf '{"SUPABASE_URL":"%s","SUPABASE_PUBLISHABLE_KEY":"%s","SUPABASE_SCHEMA":"%s"}' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_SCHEMA" > config/app.json
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=config/app.json
      - uses: actions/upload-artifact@v4
        with:
          name: gasprice-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
