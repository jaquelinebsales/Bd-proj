name: Carga semanal da ANP

# Baixa a planilha semanal de preços por posto da ANP e grava no banco da NUVEM (scripts/anp/carga_semanal.py).
# Desde 10/10/2026 a carga agendada roda no próprio servidor (servidor/carga-anp.timer, segundas e quintas),
# porque o GitHub não alcança o servidor na Tailscale. Este workflow fica só para rodar à mão na nuvem.
# Segredos usados: SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD.
on:
  workflow_dispatch:

concurrency:
  group: carga-anp
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]" openpyxl
      - name: Carregar semanas novas
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_HOST: aws-0-us-west-2.pooler.supabase.com
        run: python scripts/anp/carga_semanal.py
