name: Publicar Supabase

# Aplica as migrações e publica as Edge Functions no Supabase da NUVEM.
# Desde 10/10/2026 o app usa o servidor próprio (servidor-michael, schema combustivel; ver servidor/LEIA-ME.md),
# então este workflow só roda à mão, enquanto o projeto da nuvem existir.
# Segredos necessários no repositório: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF.
on:
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Ligar ao projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Aplicar migrações
        run: supabase db push
      - name: Publicar Edge Functions
        run: |
          supabase functions deploy enviar-precos --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy corrigir-posicao --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy sincronizar-cadastro-anp --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy excluir-conta --project-ref "$SUPABASE_PROJECT_REF"
